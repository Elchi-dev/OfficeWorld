name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, so an advisory against a dependency shows up without a push.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. On main
# every commit is its own group, so each keeps its own result: a run that is
# cancelled shows on its commit as a failure.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, tests, rules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Every check is in tools/check.sh, so a run on any machine is what CI
      # does.
      - name: Every check, as tools/check.sh runs them
        run: ./tools/check.sh

  test:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Tests
        run: cargo test --workspace --locked

  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-audit is built with the runner's own toolchain: the pinned one
      # is for the workspace, not for a tool that only reads Cargo.lock.
      - name: cargo-audit
        run: |
          cargo +stable install cargo-audit --locked --quiet
          cargo +stable audit
