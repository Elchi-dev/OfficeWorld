[workspace]
resolver = "3"
members = [
    "crates/color",
    "crates/design",
    "crates/flate",
    "crates/geometry",
    "crates/motion",
    "crates/path",
    "crates/platform",
    "crates/raster",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "BUSL-1.1"
repository = "https://github.com/Elchi-dev/OfficeWorld"
authors = ["Elchi <github@elchi.dev>"]
publish = false

[workspace.lints.rust]
# Denied and not forbidden, so the one module that has to talk to a platform
# or to the GPU can allow it for itself, with a decision record. A forbidden
# lint cannot be allowed again anywhere below.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
