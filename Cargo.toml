[workspace]
resolver = "3"
members = ["crates/motion"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "BUSL-1.1"
repository = "https://github.com/Elchi-dev/OfficeWorld"
authors = ["Elchi <github@elchi.dev>"]
publish = false

[workspace.lints.rust]
# A crate that needs unsafe code (the platform layer, the GPU) says so in its
# own manifest, with a decision record. Nothing gets it by default.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
