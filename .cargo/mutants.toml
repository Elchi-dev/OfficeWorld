# Changes to the code that no test can notice, each with its reason.
#
# `cargo mutants` changes the code in small ways, one at a time, and runs the
# tests on each change. It has to end without a missed one: a change the
# tests let through gets a test, or a line here that says why it changes
# nothing a caller can see.

# Code for a system other than the one the mutation run happens on. It is
# not built there, so no change to it can fail a test there. Such code is
# tested by its own tests on its own system.
exclude_globs = [
    "crates/platform/src/win32/**",
    "crates/platform/src/appkit/**",
]

exclude_re = [
    # The zero of a number, a point, a size or a rectangle is what
    # Default::default() gives for it.
    'replace <impl Animatable for \w+>::zero -> Self with Default::default\(\)',

    # The easing solver's comparisons, each moved onto its own boundary
    # value. Stopping at an error of exactly 1e-14 and not just below it,
    # calling an error of exactly zero too high when the solver has already
    # returned for it, and taking a Newton guess that sits exactly on the
    # edge of the bracket all end in the same answer.
    'replace < with <= in CubicBezier::parameter_at',
    'replace > with >= in CubicBezier::parameter_at',

    # The corner of a stroke where the path does not turn to either side:
    # it runs straight on, where the corner has no area, or straight back,
    # where both sides are outside and a half turn around the end covers
    # them whichever side it is begun from.
    'replace > with >= in Pen<.+>::join',

    # Summing the parts of a row with the other sign. A fill rule asks how
    # often a shape winds around a pixel and not which way round, so the
    # coverage is the same.
    'replace \+= with -= in Cells::coverage',
]
